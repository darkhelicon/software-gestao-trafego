services:
  postgres:
    image: postgres:16-alpine
    container_name: adflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adflow
      POSTGRES_PASSWORD: adflow
      POSTGRES_DB: adflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adflow_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: adflow_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://adflow:adflow@postgres:5432/adflow?schema=public"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    container_name: adflow_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://adflow:adflow@postgres:5432/adflow?schema=public"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/worker/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
