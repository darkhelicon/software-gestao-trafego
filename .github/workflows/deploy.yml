name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/helzo-scale

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      # ── Build & push all images ─────────────────────────────────────────────

      - name: Build & push API
        run: |
          docker build \
            --target production \
            --tag ${{ env.REGISTRY }}/api:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/api:latest \
            --cache-from ${{ env.REGISTRY }}/api:latest \
            --file apps/api/Dockerfile .
          docker push --all-tags ${{ env.REGISTRY }}/api

      - name: Build & push Worker
        run: |
          docker build \
            --target production \
            --tag ${{ env.REGISTRY }}/worker:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/worker:latest \
            --cache-from ${{ env.REGISTRY }}/worker:latest \
            --file apps/worker/Dockerfile .
          docker push --all-tags ${{ env.REGISTRY }}/worker

      # NEXT_PUBLIC_ vars must be passed as build args — they are embedded
      # into the JS bundle at build time, not mounted at runtime.
      - name: Build & push Web
        run: |
          docker build \
            --target production \
            --tag ${{ env.REGISTRY }}/web:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/web:latest \
            --cache-from ${{ env.REGISTRY }}/web:latest \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }} \
            .
          docker push --all-tags ${{ env.REGISTRY }}/web

      # ── Database migration ──────────────────────────────────────────────────
      # Runs prisma migrate deploy via Cloud SQL Auth Proxy before any service
      # is updated, so schema changes land before the new code goes live.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Run database migrations and seed
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          # Start proxy; ADC credentials come from google-github-actions/auth
          ./cloud-sql-proxy --port=5432 "${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}" &
          PROXY_PID=$!

          # Wait up to 15 s for the proxy to accept connections
          for i in $(seq 1 15); do
            (echo > /dev/tcp/localhost/5432) 2>/dev/null && break
            sleep 1
          done

          cd packages/database
          pnpm exec prisma migrate deploy
          pnpm exec prisma generate
          # Seed is idempotent (upsert) — safe to run on every deploy
          pnpm exec tsx src/seed.ts

          kill "$PROXY_PID" 2>/dev/null || true

      # ── Deploy services ─────────────────────────────────────────────────────
      # All three services use `gcloud run services replace` with their YAML
      # manifests (which carry all config: secrets, scaling, probes, etc.).
      # IMAGE_TAG + GCP_* vars are substituted by envsubst before piping.

      - name: Deploy API to Cloud Run
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          envsubst < infra/cloud-run/api.yaml | \
            gcloud run services replace - \
              --region=${{ secrets.GCP_REGION }} \
              --quiet

      - name: Deploy Worker to Cloud Run
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          envsubst < infra/cloud-run/worker.yaml | \
            gcloud run services replace - \
              --region=${{ secrets.GCP_REGION }} \
              --quiet

      - name: Deploy Web to Cloud Run
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          envsubst < infra/cloud-run/web.yaml | \
            gcloud run services replace - \
              --region=${{ secrets.GCP_REGION }} \
              --quiet

      # Allow unauthenticated access (public SaaS — both API and Web need to be reachable)
      - name: Allow public access to API and Web
        run: |
          for service in helzo-scale-api helzo-scale-web; do
            gcloud run services add-iam-policy-binding "$service" \
              --region=${{ secrets.GCP_REGION }} \
              --member="allUsers" \
              --role="roles/run.invoker" \
              --quiet
          done
