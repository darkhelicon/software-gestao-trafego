apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: helzo-scale-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cloudsql-instances: "${GCP_PROJECT_ID}:${GCP_REGION}:adflow-postgres"
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: helzo-scale-api-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 100
      timeoutSeconds: 60
      containers:
        - image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/helzo-scale/api:${IMAGE_TAG}
          ports:
            - containerPort: 3001
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: "500m"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            # ── Secrets from GCP Secret Manager ─────────────────────────────
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-database_url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-redis_url
                  key: latest
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-firebase_project_id
                  key: latest
            - name: FIREBASE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-firebase_client_email
                  key: latest
            - name: FIREBASE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-firebase_private_key
                  key: latest
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-encryption_key
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-jwt_secret
                  key: latest
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-jwt_refresh_secret
                  key: latest
            - name: JWT_EXPIRES_IN
              value: "15m"
            - name: JWT_REFRESH_EXPIRES_IN
              value: "7d"
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-stripe_secret_key
                  key: latest
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-stripe_webhook_secret
                  key: latest
            - name: STRIPE_PRICE_START
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-stripe_price_start
                  key: latest
            - name: STRIPE_PRICE_GROWTH
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-stripe_price_growth
                  key: latest
            - name: STRIPE_PRICE_SCALE
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-stripe_price_scale
                  key: latest
            - name: STRIPE_PRICE_ENTERPRISE
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-stripe_price_enterprise
                  key: latest
            - name: TIKTOK_APP_ID
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-tiktok_app_id
                  key: latest
            - name: TIKTOK_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-tiktok_app_secret
                  key: latest
            - name: TIKTOK_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-tiktok_redirect_uri
                  key: latest
            - name: META_APP_ID
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-meta_app_id
                  key: latest
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-meta_app_secret
                  key: latest
            - name: META_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-meta_redirect_uri
                  key: latest
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-gcp_project_id
                  key: latest
            - name: GCP_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-gcp_bucket_name
                  key: latest
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-sentry_dsn
                  key: latest
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-allowed_origins
                  key: latest
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: helzo-scale-frontend_url
                  key: latest
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            periodSeconds: 30
            failureThreshold: 3
